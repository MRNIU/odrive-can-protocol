name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf, thumbv6m-none-eabi
      - run: cargo fmt --check
      - run: cargo test --locked --all-targets --all-features --features embassy-stm32/stm32h723vg
      - run: cargo test --locked --doc --all-features --features embassy-stm32/stm32h723vg
      - run: cargo clippy --locked --all-targets --all-features --features embassy-stm32/stm32h723vg -- -D warnings
      - run: cargo doc --locked --no-deps --all-features --features embassy-stm32/stm32h723vg
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo build --locked --lib --target thumbv7em-none-eabihf
      - run: cargo build --locked --lib --target thumbv6m-none-eabi
      - run: cargo tree --locked --edges normal
      - run: cargo package --locked

  embedded:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chip: [stm32h723vg, stm32f405rg]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - run: cargo check --locked --lib --target thumbv7em-none-eabihf --features embassy-stm32,embassy-stm32/${{ matrix.chip }}

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo check --locked --lib
      - run: cargo check --locked --lib --features embedded-can
